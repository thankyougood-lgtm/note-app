<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Note app</title>
  <meta name="description" content="Write it. Keep it. Find it." />
  <meta name="theme-color" content="#033a2c" />

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== SVG icon sprite (used with <use href="#id">) ===== -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/><path d="m14.5 5.5 3 3"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 3 10.5V20a1 1 0 0 0 1 1h5v-6h6v6h5a1 1 0 0 0 1-1v-9.5z"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></symbol>
  </svg>

  <!-- ===== Welcome screen (first thing the user sees) ===== -->
  <section class="welcome" id="welcome">
    <span class="blob blob-top" aria-hidden="true"></span>
    <span class="blob blob-bottom" aria-hidden="true"></span>

    <div class="welcome-center">
      <div class="wordmark">
        <span class="wm-icon"><svg width="34" height="34"><use href="#i-plus"/></svg></span>
        <span class="wm-text">NOTE</span>
      </div>
      <h2>Welcome!</h2>
    </div>

    <button class="welcome-btn" id="btn-start" aria-label="Start writing">
      <svg width="34" height="34"><use href="#i-pencil"/></svg>
    </button>
  </section>

  <div class="app">

    <!-- ===== Header ===== -->
    <header class="header">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg width="22" height="22"><use href="#i-plus"/></svg>
        </div>
        <div class="brand-text">
          <h1>NOTE</h1>
          <p>Write it. Keep it. Find it.</p>
        </div>
      </div>

      <div class="header-actions">
        <button class="icon-btn" id="btn-search" aria-label="Search">
          <svg width="22" height="22"><use href="#i-search"/></svg>
        </button>
        <button class="icon-btn" id="btn-menu" aria-label="Menu">
          <svg width="22" height="22"><use href="#i-dots"/></svg>
        </button>
      </div>
    </header>

    <!-- ===== Search bar ===== -->
    <div class="search">
      <svg width="18" height="18"><use href="#i-search"/></svg>
      <input type="search" id="search-input" placeholder="Search your notes..." autocomplete="off" />
    </div>

    <!-- ===== Filter chips ===== -->
    <nav class="chips" id="chips" aria-label="Filter notes">
      <button class="chip active" data-filter="all"><svg width="16" height="16"><use href="#i-grid"/></svg>All</button>
      <button class="chip" data-filter="note"><svg width="16" height="16"><use href="#i-note"/></svg>Notes</button>
      <button class="chip" data-filter="todo"><svg width="16" height="16"><use href="#i-check"/></svg>To-Do</button>
      <button class="chip" data-filter="favorites"><svg width="16" height="16"><use href="#i-star"/></svg>Favorites</button>
      <button class="chip" data-filter="trash"><svg width="16" height="16"><use href="#i-trash"/></svg>Trash</button>
    </nav>

    <!-- ===== List title + sort ===== -->
    <div class="list-head">
      <h2 id="list-title">Recent Notes</h2>
      <label class="sort">
        <select id="sort-select" aria-label="Sort notes">
          <option value="latest">Latest</option>
          <option value="oldest">Oldest</option>
          <option value="title">Title</option>
        </select>
        <svg width="16" height="16"><use href="#i-chevron"/></svg>
      </label>
    </div>

    <!-- ===== Notes list (filled by app.js) ===== -->
    <main>
      <ul class="notes" id="notes-list"></ul>
      <p class="empty" id="empty-state" hidden>No notes here yet. Tap the pencil to add one.</p>
    </main>

  </div>

  <!-- ===== Floating add button ===== -->
  <button class="fab" id="btn-add" aria-label="Add note">
    <svg width="24" height="24"><use href="#i-pencil"/></svg>
  </button>

  <!-- ===== Bottom navigation ===== -->
  <nav class="bottom-nav" aria-label="Main">
    <button class="nav-item active" data-view="home"><svg width="22" height="22"><use href="#i-home"/></svg><span>Home</span></button>
    <button class="nav-item" data-view="folders"><svg width="22" height="22"><use href="#i-folder"/></svg><span>Folders</span></button>
    <button class="nav-item" data-view="favorites"><svg width="22" height="22"><use href="#i-star"/></svg><span>Favorites</span></button>
    <button class="nav-item" data-view="settings"><svg width="22" height="22"><use href="#i-settings"/></svg><span>Settings</span></button>
  </nav>

  <!-- ===== Add / edit note dialog ===== -->
  <dialog id="editor" class="editor">
    <form method="dialog" id="editor-form">
      <input type="text" id="note-title" placeholder="Title" required />
      <textarea id="note-body" placeholder="Write something..." rows="8"></textarea>
      <div class="editor-row">
        <select id="note-type" aria-label="Note type">
          <option value="note">Note</option>
          <option value="todo">To-Do</option>
        </select>
        <div class="editor-actions">
          <button type="button" id="btn-cancel" class="btn ghost">Cancel</button>
          <button type="submit" class="btn primary">Save</button>
        </div>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
