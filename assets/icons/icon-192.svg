<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6AC2FF"/>
      <stop offset="45%" stop-color="#3B8EEF"/>
      <stop offset="100%" stop-color="#1C5FD6"/>
    </linearGradient>
    <linearGradient id="glossGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pencilBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE06B"/>
      <stop offset="100%" stop-color="#FFC72C"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#bgGradient)"/>

  <!-- Glossy highlight -->
  <ellipse cx="256" cy="130" rx="230" ry="130" fill="url(#glossGradient)"/>

  <!-- Notebook shadow -->
  <rect x="134" y="156" width="256" height="248" rx="18" fill="#0A2E6B" opacity="0.18"/>

  <!-- Notebook body -->
  <rect x="124" y="146" width="256" height="248" rx="18" fill="#FFFFFF"/>

  <!-- Spiral rings -->
  <g stroke="#3B8EEF" stroke-width="9" fill="none">
    <ellipse cx="160" cy="146" rx="12" ry="14"/>
    <ellipse cx="202" cy="146" rx="12" ry="14"/>
    <ellipse cx="244" cy="146" rx="12" ry="14"/>
    <ellipse cx="286" cy="146" rx="12" ry="14"/>
    <ellipse cx="328" cy="146" rx="12" ry="14"/>
    <ellipse cx="370" cy="146" rx="12" ry="14"/>
  </g>

  <!-- Text lines -->
  <g fill="#8FB8EA">
    <rect x="156" y="210" width="168" height="16" rx="8"/>
    <rect x="156" y="246" width="168" height="16" rx="8"/>
    <rect x="156" y="282" width="168" height="16" rx="8"/>
    <rect x="156" y="318" width="100" height="16" rx="8"/>
  </g>

  <!-- Pencil group -->
  <g transform="translate(300,300) rotate(45)">
    <!-- eraser -->
    <rect x="-16" y="-130" width="32" height="34" rx="6" fill="#FF8FA3"/>
    <rect x="-16" y="-100" width="32" height="10" fill="#E85D75"/>
    <!-- body -->
    <rect x="-16" y="-90" width="32" height="150" fill="url(#pencilBody)"/>
    <rect x="-3" y="-90" width="6" height="150" fill="#FFFFFF" opacity="0.4"/>
    <!-- wood tip -->
    <polygon points="-16,60 16,60 0,96" fill="#E8C48A"/>
    <!-- graphite tip -->
    <polygon points="-6,86 6,86 0,104" fill="#4A4A4A"/>
  </g>
</svg>
